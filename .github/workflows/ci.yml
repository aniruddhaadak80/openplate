name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing below needs a database or an API key: without DATABASE_URL the app
      # uses the embedded PGlite build of Postgres and all three upstreams are
      # keyless public endpoints.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

  smoke:
    name: browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The smoke test starts the production bundle, so this job needs its own
      # build rather than a downloaded artefact from the other job.
      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Rehearses the real production bundle on the embedded store. The database
      # is not durable here, which is exactly why a deployment without a hosted
      # DATABASE_URL refuses to boot.
      - name: Browser smoke test
        run: npm run smoke

      # A dead link in the README is a dead link in a visitor's face. A
      # rate-limited host is reported but does not fail the build, because a 429
      # means the resource exists and the runner is being throttled.
      - name: Check that every README link resolves
        run: npm run check:links

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7